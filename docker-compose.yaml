services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - APP_NAME={APP_NAME}
      - DATABASE_URL=sqlite:///instance/rate.sqlite
      - API_KEY={API_KEY}
      - EXCHANGE_API_URL={EXCHANGE_API_URL}
    volumes:
      - .:/app
      - ./instance:/app/instance
